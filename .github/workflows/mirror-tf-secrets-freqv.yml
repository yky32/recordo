# One-shot: copy Apple/TF secrets to yky32/freqv. Delete after success.
name: Mirror TF secrets to FreqV

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Write secrets to freqv
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FULL }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_IS_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_IS_BASE64 }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing GH_PAT_FULL on recordo"
            exit 1
          fi
          TARGET=yky32/freqv
          set_secret() {
            local name="$1"
            local val="${2:-}"
            if [ -z "$val" ]; then
              echo "SKIP empty $name"
              return 0
            fi
            printf '%s' "$val" > /tmp/sval
            gh secret set "$name" --repo "$TARGET" < /tmp/sval
            rm -f /tmp/sval
            echo "SET $name len=${#val}"
          }
          set_secret APP_STORE_CONNECT_API_KEY_ID "$APP_STORE_CONNECT_API_KEY_ID"
          set_secret APP_STORE_CONNECT_ISSUER_ID "$APP_STORE_CONNECT_ISSUER_ID"
          set_secret APP_STORE_CONNECT_API_KEY_CONTENT "$APP_STORE_CONNECT_API_KEY_CONTENT"
          set_secret APP_STORE_CONNECT_API_KEY_IS_BASE64 "$APP_STORE_CONNECT_API_KEY_IS_BASE64"
          set_secret IOS_DISTRIBUTION_CERT_BASE64 "$IOS_DISTRIBUTION_CERT_BASE64"
          set_secret IOS_DISTRIBUTION_CERT_PASSWORD "$IOS_DISTRIBUTION_CERT_PASSWORD"
          echo "DONE names only. Did not copy MAPBOX/SUPABASE."
          gh secret list --repo "$TARGET"
