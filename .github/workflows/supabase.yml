# Apply Recordo UGC schema to production Supabase.
# Manual: Actions → Supabase → Run workflow
# Also runs when migrations change.

name: Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase.yml'
      - 'scripts/seed_parks_catalog.py'
      - 'assets/data/hk_osm_parks.json'
      - 'lib/features/parks/hk_seed_parks.dart'

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: db push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link + push migrations
        run: |
          set -euo pipefail
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing+=("SUPABASE_DB_PASSWORD")
          [ -n "$SUPABASE_URL" ] || missing+=("SUPABASE_URL")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub secrets: ${missing[*]}"
            echo "Add them at: https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            echo "ACCESS_TOKEN = https://supabase.com/dashboard/account/tokens (sbp_…)"
            echo "DB_PASSWORD  = Project Settings → Database"
            echo "URL          = https://jutuorafntyvukxzehlg.supabase.co"
            exit 1
          fi

          PROJECT_REF="${SUPABASE_URL#https://}"
          PROJECT_REF="${PROJECT_REF#http://}"
          PROJECT_REF="${PROJECT_REF%%.supabase.co*}"
          PROJECT_REF="${PROJECT_REF%%/*}"

          echo "Linking $PROJECT_REF"
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --yes

      - name: Seed park catalog
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: python3 scripts/seed_parks_catalog.py
